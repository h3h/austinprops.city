# Site settings
title: "Austin Propositions"
description: "A simple site about the propositions on Austin ballots."
baseurl: ""
url: "https://austinprops.city"

# The ballot shown on the home page. Older ballots live on /archive.
current_ballot: 2026
election_date: "November 3, 2026"
ballot_note: >-
  Travis County, Austin ISD and the State of Texas have no propositions on this
  ballot. Your ballot still has races for those offices; look up your sample
  ballot at <a href="https://votetravis.gov">VoteTravis.gov</a>.
# google_analytics: 'UA-XXXXXX-X'
# twitter_username: 'twitter_username'

# Build settings
markdown: kramdown

exclude:
  - assets
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yaml
  - vendor/bundle

permalink: "/:year/:title/"

